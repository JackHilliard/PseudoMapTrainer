seed: 17
device: "cuda:0"
output: "./output/multi_trip"

dataset:
  dataset: "NuscDataset"
  label_mapping: "MapillaryVistasV2"
  base_dir: data/nuscenes
  label_dir: data/m2f_infer
  road_gt_dir: data/nuScenes_road_gt
  clip_list: null
  use_geo_split: True
  splits: ["train", "val", "test"]

  # resized image size
  image_width: 800
  image_height: 450

  camera_names:
    - "CAM_FRONT"
    - "CAM_FRONT_LEFT"
    - "CAM_FRONT_RIGHT"
    - "CAM_BACK"
    - "CAM_BACK_LEFT"
    - "CAM_BACK_RIGHT"

train:
  vis: False
  log: True
  store_cfg: True
  store_artefacts: True
  debug_from: -1
  detect_anomaly: False
  start_checkpoint: ""
  eval: True
  output_render: False

model:
  bev_resolution: 0.05 # meters
  cut_range: 7
  sh_degree: 3
  use_rgb: True
  use_label: True
  opt_xy: False
  white_background: False

optimization:
  epochs: 2
  random_background: False
  position_lr_init: 0.000016
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  percent_dense: 0.01
  feature_lr: 0.0005
  opacity_lr: 0.0001
  scaling_lr: 0.0001
  rotation_lr: 0.0001
  rgb_lr: 0.008
  label_lr: 0.1
  exposure_lr: 0.001


  seg_loss_weight: 0.06
  smooth_loss_weight: 1
  depth_loss_weight: 0
  z_weight: 0.5

pipeline:
  convert_SHs_python: False
  compute_cov3D_python: False
  debug: False

pre_processing:
  percent_of_data_start: 0 # Percentage of data to start from. Is only used if clip_list is null
  percent_of_data_end: 100 # Percentage of data to end. Is only used if clip_list is null

bev_processing:
  pad_width: 80
  combine_scenes: True
  scene_collection_path: geo_split.json # if not null, overwrites clip_list
  percent_of_data_start: 0 # Percentage of data to start from. Is only used if clip_list is null
  percent_of_data_end: 100 # Percentage of data to end. Is only used if clip_list is null
  height: 60 # in meter
  width: 30 # in meter
